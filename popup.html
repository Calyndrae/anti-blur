<meta charset="utf-8">
<title>Anti Blur</title>
<meta name="author" content="Calyndrae">
<meta name="copyright" content="© 2026 Calyndrae. All rights reserved.">
<style>
  /* ── tokens ────────────────────────────────────────────────────────────
     Industrial / mono-technical. Mono carries data, sans carries prose.
     Base unit 4. Radius 3 (precise register). Semantic ok/leak stay
     separate from the neutral ramp — they do real work here.            */
  :root {
    --ground:#eceef1; --surface:#fbfcfd; --ink:#14171c; --muted:#545c69;
    --rule:#d3d8df;   --ok:#12704a;      --ok-bg:#e4f0ea;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#101317; --surface:#171b21; --ink:#e6e9ed; --muted:#98a1ae;
      --rule:#272c34;   --ok:#5fcf9a;      --ok-bg:#16241e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px; background: var(--surface); color: var(--ink);
    font: 400 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* header */
  .hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .hd img { width: 26px; height: 26px; border-radius: 5px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .badge {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ok); background: var(--ok-bg); border-radius: 3px; padding: 5px 7px;
  }
  .badge b { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* readout — the substance: what every page is told */
  .lede {
    padding: 0 16px 12px; color: var(--muted); font-size: 12px; line-height: 1.55;
    text-wrap: pretty;
  }
  dl { border-top: 1px solid var(--rule); }
  .r {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 9px 16px; border-bottom: 1px solid var(--rule);
  }
  dt { font: 400 11.5px/1.4 var(--mono); color: var(--muted); }
  dd {
    font: 500 11.5px/1.4 var(--mono); color: var(--ok);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* footer */
  .ft {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 16px 13px; font-size: 11px; color: var(--muted);
  }
  .ft a { color: inherit; text-decoration: underline; text-underline-offset: 2px; border-radius: 3px; }
  .ft a:hover { color: var(--ink); }
  .ft a:focus-visible { outline: 2px solid var(--ok); outline-offset: 3px; }
</style>

<div class="hd">
  <img src="icons/icon48.png" alt="">
  <h1>Anti Blur</h1>
  <p class="badge"><b></b>On</p>
</div>

<p class="lede">Every page you open is told the same four things, whatever you are
actually doing:</p>

<dl>
  <div class="r"><dt>document.hasFocus()</dt><dd>true</dd></div>
  <div class="r"><dt>document.hidden</dt><dd>false</dd></div>
  <div class="r"><dt>visibilityState</dt><dd>"visible"</dd></div>
  <div class="r"><dt>blur · visibilitychange</dt><dd>not delivered</dd></div>
</dl>

<div class="ft">
  <span>Nothing leaves your device</span>
  <span><a href="privacy-policy.html" target="_blank" rel="noopener">Privacy</a> ·
        <a href="terms.html" target="_blank" rel="noopener">Terms</a></span>
</div>
